name: Build Android (Reusable)

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      metamask-environment:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "18"
      java-version:
        required: false
        type: string
        default: "17"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Patch react-native-aes-crypto-forked for Gradle 8+
        run: |
    
          sed -i 's/^\s*compile /implementation /' node_modules/react-native-aes-crypto-forked/android/build.gradle
    
          sed -i 's/com.android.support:appcompat-v7:23.0.1/androidx.appcompat:appcompat:1.6.1/' node_modules/react-native-aes-crypto-forked/android/build.gradle

      - name: Patch react-native-i18n for Gradle 8+
        run: |
          sed -i 's/^\s*compile /implementation /' node_modules/react-native-i18n/android/build.gradle

      - name: Patch react-native-os for Gradle 8+
        run: |
          sed -i 's/^\s*compile /implementation /' node_modules/react-native-os/android/build.gradle
    
      - name: Build Android
        env:
          METAMASK_ENVIRONMENT: ${{ inputs.metamask-environment }}
        run: |
          echo "Building Android with environment: $METAMASK_ENVIRONMENT"
          cd android
          ./gradlew assemble${{ inputs.build-type }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metamask-android-${{ inputs.build-type }}
          path: android/app/build/outputs/apk/**/*.apk
